name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps :
      - name: Get the code
        uses: actions/checkout@v4

      - name: Show files
        run: |
          ls -la
          cat index.html

      - name: Connect to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USER}}
          key: ${{secrets.EC2_SSH_KEY_B64}}
          port: 22
          script: |
            echo "Connected to EC2"
            whoami
            hostname
